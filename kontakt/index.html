</head>
<body>
<a class="skip-link" href="#main">Przejdź do treści</a>
<div class="shell">
<div class="wrap">
<header class="site-nav">
<a class="brand" href="/grupa-wawrzyniak/" aria-label="Grupa Wawrzyniak — strona główna"><img class="brand-logo" src="/grupa-wawrzyniak/assets/img/logo.svg" width="232" height="53" alt="Grupa Wawrzyniak"></a>
<button class="nav-toggle" type="button" aria-expanded="false" aria-controls="main-navigation" aria-label="Otwórz menu" hidden><span></span><span></span></button>
<nav id="main-navigation" class="nav-links" aria-label="Nawigacja główna">
<a href="/grupa-wawrzyniak/inwestycje/">Inwestycje</a><a href="/grupa-wawrzyniak/#o-nas">O nas</a><a href="/grupa-wawrzyniak/kontakt/" aria-current="page">Kontakt</a>
</nav>
<a class="btn nav-cta" href="/grupa-wawrzyniak/kontakt/">Porozmawiajmy <span aria-hidden="true">&#8599;</span></a>
</header>
<main id="main">
<section class="section reveal">
<span class="eyebrow">Kontakt</span>
<h1>Porozmawiajmy o Twoim domu</h1>
<p class="copy">Napisz, o który lokal pytasz — zachowamy kontekst inwestycji i lokalu w zapytaniu.</p>

<script type="application/json" id="investment-names">{"inwestycja-01": "Inwestycja 01"}</script>
<form class="contact-form" aria-describedby="form-status">
<div class="field">
<label for="field-name">Imię i nazwisko</label>
<input id="field-name" name="name" type="text" autocomplete="name" required maxlength="120">
</div>
<div class="field">
<label for="field-channel">E-mail lub telefon</label>
<input id="field-channel" name="channel" type="text" autocomplete="email" required maxlength="160" aria-describedby="channel-help">
</div>
<p id="channel-help" class="form-help">Podaj adres e-mail lub numer telefonu.</p>
<div class="field">
<label for="field-investment">Inwestycja</label>
<input id="field-investment" name="investment" type="text" value="Inwestycja 01">
</div>
<div class="field">
<label for="field-unit">Lokal</label>
<input id="field-unit" name="unit" type="text" placeholder="np. Lokal 1">
</div>
<div class="field">
<label for="field-message">Wiadomość</label>
<textarea id="field-message" name="message" rows="5" required maxlength="5000"></textarea>
</div>
<p class="form-help">Tryb testowy: dane nie są wysyłane ani zapisywane.</p>
<button class="btn" type="submit" disabled>Sprawdź zapytanie</button>
<p id="form-status" role="status" aria-live="polite"></p>
<noscript>Włącz JavaScript, aby sprawdzić formularz.</noscript>
</form>
</section>
</main>
<footer class="site-footer">
<a class="brand" href="/grupa-wawrzyniak/" aria-label="Grupa Wawrzyniak — strona główna"><img class="brand-logo" src="/grupa-wawrzyniak/assets/img/logo.svg" width="232" height="53" alt="Grupa Wawrzyniak" loading="lazy"></a>
<a href="/grupa-wawrzyniak/kontakt/">Kontakt</a>
</footer>
</div>
</div>
</body>
</html>
